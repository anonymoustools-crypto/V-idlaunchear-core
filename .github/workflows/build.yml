name: Build APK

on:
  push:
    branches: [main]
    paths:
      - ".github/VOID_LAUNCHEAR_BUILD_REQUEST"
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Debug
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      RELEASE_KEYSTORE_BASE64:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["arm64", "arm"]
      fail-fast: false

    env:
      BUILD_VARIANT: ${{ inputs.variant || 'Debug' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Restore private release signing key
        if: env.BUILD_VARIANT == 'Release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing RELEASE_KEYSTORE_BASE64 GitHub Actions secret."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > ZalithLauncher/zalith_launcher.jks
          chmod 600 ZalithLauncher/zalith_launcher.jks
          test -s ZalithLauncher/zalith_launcher.jks

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant || 'Debug' }} -Darch=${{ matrix.arch }}

      - name: Rename APK for distribution
        run: |
          output_dir="ZalithLauncher/build/outputs/apk/${BUILD_VARIANT,,}"
          version="$(awk -F= '$1 == "launcher_version_name" { print $2; exit }' ZalithLauncher/gradle.properties)"
          test -n "$version"
          case "${{ matrix.arch }}" in
            arm) arch_label="armv7" ;;
            arm64) arch_label="arm64" ;;
            *) echo "Unsupported distribution architecture"; exit 1 ;;
          esac
          shopt -s nullglob
          apks=("$output_dir"/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK was produced in $output_dir"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            if [ "$BUILD_VARIANT" = "Release" ]; then
              target="$output_dir/VøidLaunchear-${version}-${arch_label}.apk"
            else
              target="$output_dir/VøidLaunchear-${version}-${arch_label}-Debug.apk"
            fi
            mv "$apk" "$target"
            echo "Prepared $target"
          done

      - name: Upload Release APK for ${{ matrix.arch }}
        if: env.BUILD_VARIANT == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: VøidLaunchear APK (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/release/VøidLaunchear-*.apk
          if-no-files-found: error

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: env.BUILD_VARIANT == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: env.BUILD_VARIANT == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: VøidLaunchear APK (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/debug/VøidLaunchear-*.apk
          if-no-files-found: error

  publish-public-apks:
    name: Publish direct APK downloads
    if: (github.event_name == 'workflow_dispatch' && inputs.variant == 'Release') || (github.event_name == 'workflow_call' && inputs.variant == 'Release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download ARM APK variants
        uses: actions/download-artifact@v4
        with:
          pattern: VøidLaunchear APK (*)
          merge-multiple: true
          path: release-assets

      - name: Verify direct APK assets
        run: |
          shopt -s nullglob
          apks=(release-assets/*.apk)
          if [ "${#apks[@]}" -ne 2 ]; then
            echo "Expected exactly two APK files (ARM64 and ARMv7); found ${#apks[@]}."
            find release-assets -maxdepth 2 -type f -print
            exit 1
          fi
          printf '%s\\n' "${apks[@]}"
          for apk in "${apks[@]}"; do
            file "$apk"
            test "$(stat -c%s "$apk")" -gt 100000000
          done

      - name: Read app version
        id: version
        run: |
          version="$(awk -F= '$1 == "launcher_version_name" { print $2; exit }' ZalithLauncher/gradle.properties)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: VøidLaunchear ${{ steps.version.outputs.version }}
          body: |
            Direct APK downloads for VøidLaunchear ${{ steps.version.outputs.version }}.

            - ARM64: VøidLaunchear-${{ steps.version.outputs.version }}-arm64.apk
            - ARMv7 (32-bit): VøidLaunchear-${{ steps.version.outputs.version }}-armv7.apk

            Each file is a standalone APK. No ZIP extraction is required.
            Physical-device compatibility testing is still required.
          files: release-assets/*.apk
          fail_on_unmatched_files: true
          make_latest: true
