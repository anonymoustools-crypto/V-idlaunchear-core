name: Migrate VøidLaunchear package identity

on:
  push:
    branches:
      - feature/void-roadmap-completion
    paths:
      - ".github/scripts/rebrand-voidlauncher.sh"
      - ".github/workflows/rebrand-voidlauncher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          ref: feature/void-roadmap-completion
          fetch-depth: 0

      - name: Apply package and module migration
        run: |
          chmod +x .github/scripts/rebrand-voidlauncher.sh
          .github/scripts/rebrand-voidlauncher.sh

      - name: Audit remaining upstream URL references
        shell: bash
        run: |
          if grep -RInE 'https?://(api\\.)?github\\.com/(VoidLauncher/Zalith-Info|VoidLauncher/VoidLauncher2)|zalithlauncher2|zalith-info|ifdian\\.net/a/MovTery|com\\.movtery\\.activity|com\\.movtery\\.zalithlauncher' VoidLauncher/src/main --include='*.kt' --include='*.xml'; then
            echo "::error::Legacy Zalith service URLs or app identifiers remain in the Vøid app source."
            exit 1
          fi
          echo "No legacy Zalith service URLs or app identifiers found."
