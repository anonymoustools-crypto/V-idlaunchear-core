name: Migrate VøidLaunchear package identity

on:
  push:
    branches:
      - feature/void-roadmap-completion
    paths:
      - ".github/scripts/rebrand-voidlauncher.sh"
      - ".github/workflows/rebrand-voidlauncher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          ref: feature/void-roadmap-completion
          fetch-depth: 0

      - name: Apply package and module migration
        run: |
          chmod +x .github/scripts/rebrand-voidlauncher.sh
          .github/scripts/rebrand-voidlauncher.sh

      - name: Audit remaining upstream URL references
        run: |
          grep -RInE 'URL_PROJECT_INFO|URL_COMMUNITY|URL_WEBLATE|URL_SUPPORT|Zalith-Info|zalithlauncher2|zalith-info|VoidLauncher/VoidLauncher2|ifdian.net/a/MovTery' VoidLauncher/src/main/java --include='*.kt' || true
