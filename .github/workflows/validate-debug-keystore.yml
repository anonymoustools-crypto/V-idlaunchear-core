name: Validate Debug Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate keystore and key passwords
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="VoidLauncher/void_launcher_debug.jks"
          ALIAS="movtery_zalith_debug"

          if [[ -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::STORE_PASSWORD or KEY_PASSWORD repository secret is missing."
            exit 1
          fi

          # First confirm that the keystore opens and contains the expected alias.
          if ! keytool -list -keystore "$KEYSTORE" -storetype JKS -storepass:env STORE_PASSWORD -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore could not be opened with STORE_PASSWORD, or the expected alias was not found."
            exit 1
          fi

          # Then confirm the alias contains a private key that opens with KEY_PASSWORD.
          cat > VerifyKey.java <<'EOF'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;

          public class VerifyKey {
              public static void main(String[] args) throws Exception {
                  char[] storePassword = System.getenv("STORE_PASSWORD").toCharArray();
                  char[] keyPassword = System.getenv("KEY_PASSWORD").toCharArray();
                  KeyStore ks = KeyStore.getInstance("JKS");
                  try (FileInputStream in = new FileInputStream(args[0])) {
                      ks.load(in, storePassword);
                  }
                  Key key = ks.getKey(args[1], keyPassword);
                  if (!(key instanceof java.security.PrivateKey)) {
                      throw new IllegalStateException("Alias does not contain a private key");
                  }
              }
          }
          EOF
          javac VerifyKey.java
          if ! java VerifyKey "$KEYSTORE" "$ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore opened, but KEY_PASSWORD did not unlock the private key for the expected alias."
            exit 1
          fi

          echo "SUCCESS: Both signing passwords are valid for the existing debug keystore."
