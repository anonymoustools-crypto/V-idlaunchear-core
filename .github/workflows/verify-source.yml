name: Verify VøidLaunchear source

on:
  push:
    branches:
      - feature/void-roadmap-completion
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches:
      - main
      - feature/void-roadmap-completion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile app Kotlin sources (no APK packaging)
        run: |
          chmod +x gradlew
          ./gradlew :ZalithLauncher:compileDebugKotlin --stacktrace

      - name: Run launcher unit tests
        run: ./gradlew :ZalithLauncher:testDebugUnitTest --stacktrace
