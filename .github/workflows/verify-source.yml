name: Build VøidLaunchear debug APK

on:
  push:
    branches:
      - feature/void-roadmap-completion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile app Kotlin sources
        run: |
          chmod +x gradlew
          ./gradlew :ZalithLauncher:compileDebugKotlin --stacktrace

      - name: Run launcher unit tests
        run: ./gradlew :ZalithLauncher:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :ZalithLauncher:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidLaunchear-debug-apk
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
