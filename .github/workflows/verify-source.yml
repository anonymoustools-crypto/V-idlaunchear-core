name: Build VøidLaunchear debug APK

on:
  push:
    branches:
      - feature/void-roadmap-completion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          mkdir -p "$HOME/.cargo/bin"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Audit upstream launcher endpoints
        shell: bash
        run: |
          if grep -RInE 'https?://(api\\.)?github\\.com/(VoidLauncher/Zalith-Info|VoidLauncher/VoidLauncher2)|zalithlauncher2|zalith-info|ifdian\\.net/a/MovTery|com\\.movtery\\.activity|com\\.movtery\\.zalithlauncher' VoidLauncher/src/main --include='*.kt' --include='*.xml'; then
            echo "::error::Legacy Zalith service URLs or app identifiers remain in the Vøid app source."
            exit 1
          fi
          echo "No legacy Zalith service URLs or app identifiers found."

      - name: Compile app Kotlin sources
        run: |
          chmod +x gradlew
          ./gradlew :VoidLauncher:compileDebugKotlin --stacktrace

      - name: Run launcher unit tests
        run: ./gradlew :VoidLauncher:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :VoidLauncher:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidLaunchear-debug-apk
          path: VoidLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
